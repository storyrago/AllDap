# 운영 배포용 compose. (로컬 개발은 docker-compose.yml — 거긴 DB 만 띄운다)
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 배포 대상: EC2 t3.micro(1GB) 한 대 + RDS(Postgres 16 + pgvector).
# DB 를 RDS 로 뺀 이유는 1GB 에 다 안 들어가기 때문이다 — Postgres 를 빼면
# 약 120MB 가 살아난다. 자동 백업·스냅샷이 딸려오는 것은 덤이다.
#
# 🔴 이 파일의 가장 중요한 성질: <ports: 를 여는 서비스가 caddy 하나뿐이다.>
#    특히 ai-service 의 /internal/* 에는 인증이 없어서, 포트가 하나라도 열리면
#    누구나 남의 봇 문서를 읽는다. "방화벽으로 막는다" 가 아니라
#    <애초에 호스트에 뜨지 않게> 하는 것이 훨씬 안전하다 —
#    규칙은 잊거나 실수로 지울 수 있지만, 안 열린 포트는 실수할 여지가 없다.

services:
  api:
    # 기본은 <CI 가 만들어 GHCR 에 올린 이미지를 pull> 한다.
    # 1GB 서버에서는 Gradle 컴파일이 OOM 이라 빌드를 CI 로 뺐다
    # (.github/workflows/publish.yml). 문제가 생기면 IMAGE_TAG 를 이전 커밋 SHA 로
    # 바꿔 즉시 되돌릴 수 있다.
    image: ghcr.io/${GHCR_REPO}/api:${IMAGE_TAG:-latest}
    build:
      # `--build` 를 붙였을 때만 쓰인다(사양이 넉넉한 곳에서 검증할 때).
      # ⚠️ 컨텍스트가 루트다. api/build.gradle 이 ../widget 을 읽는다.
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # RDS 엔드포인트. 같은 VPC 안이라 인터넷을 거치지 않는다.
      DB_URL: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 빌링키 암호화 키. application-prod.yaml 이 기본값을 안 두므로 없으면 기동 실패한다.
      BILLING_CRYPTO_KEY: ${BILLING_CRYPTO_KEY}
      # ⚠️ JWT_SECRET 과 다르다 — 없어도 기동을 막지 <않는다>. TossProperties 는 순수 record 라
      # 가드가 없고, 비면 빈 문자열이 그대로 주입돼 컨테이너가 정상 healthy 로 뜬다.
      # 증상은 카드를 등록할 때에야 401→503 으로 드러난다. 자세한 근거는 docs/DEPLOY.md §7 참고.
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      # Python 은 같은 compose 네트워크 안에서만 부른다. 인터넷에서 닿지 않는다.
      AI_SERVICE_BASE_URL: http://ai-service:8001
      # Vercel 배포 주소. application-prod.yaml 이 기본값을 안 두므로 없으면 기동 실패한다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # 1GB 머신에서 OOM 방아쇠가 되는 값. 자세한 이유는 application-prod.yaml 주석 참고.
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10MB}
      # 🔴 힙을 <명시>한다. Dockerfile 의 MaxRAMPercentage 는 <컨테이너> 메모리 기준인데
      #    컨테이너에 제한을 안 걸어서, 그대로 두면 호스트 1GB 의 70% 를 자기 몫으로
      #    계산해 Python·Caddy 와 부딪힌다.
      #    남는 분량: OS+Docker 250MB · Python 250MB · Caddy 20MB
      #    ExitOnOutOfMemoryError: 힙이 마르면 살아서 버둥거리지 말고 죽어라.
      #    restart 정책이 다시 띄우는 편이 <반쯤 죽은 채로 응답하는 것>보다 낫다.
      JAVA_OPTS: >-
        -Xms192m -Xmx256m
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      # t3.micro 는 느리다. 이 시간 안의 실패는 재시도 횟수로 세지 않는다.
      start_period: 180s
    # ports 없음 — Caddy 가 프록시한다.

  ai-service:
    image: ghcr.io/${GHCR_REPO}/ai-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    depends_on:
      # 🔴 순서가 중요하다. 스키마는 <Spring 이 기동하면서 Flyway 로> 만든다.
      #    Python 을 먼저 띄우면 테이블이 없는 DB 를 보게 된다.
      #    DB 가 RDS 로 나갔어도 이 관계는 그대로다 — 오히려 더 중요해졌다.
      #    (RDS 는 우리가 띄우기 전부터 떠 있으므로 db 헬스체크는 필요 없다)
      api:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_API_TOKEN: ${CF_API_TOKEN}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    # ports 없음 — 이 서비스는 인터넷에서 보이면 안 된다.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 80 은 Let's Encrypt 의 HTTP-01 인증에 필요하다. 닫으면 인증서 발급이 안 된다.
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 남긴다. 안 남기면 재시작마다 재발급을 시도해
      # Let's Encrypt 발급 한도에 걸린다.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
