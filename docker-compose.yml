services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alldap-db
    environment:
      POSTGRES_USER: alldap
      POSTGRES_PASSWORD: alldap
      POSTGRES_DB: alldap
      TZ: Asia/Seoul
    ports:
      # 127.0.0.1 에 바인딩한다. "5432:5432" 로 두면 0.0.0.0 에 열려서
      # 같은 공유기/사내망에 있는 누구나 DB 에 붙을 수 있다(계정이 alldap/alldap 이라 더 위험).
      # PRD 가 "Python 서비스 외부 노출 금지" 를 [확정]으로 두고 있는데
      # 정작 DB 가 열려 있으면 앞뒤가 맞지 않는다. 로컬에서만 접근 가능하게 막는다.
      - "127.0.0.1:5432:5432"
    volumes:
      - alldap-pgdata:/var/lib/postgresql/data
      # 스키마는 이제 Flyway 가 관리한다.
      # (api/src/main/resources/db/migration/ — Spring 기동 시 적용)
      # 여기에 ./db 를 다시 마운트하면 초기화 스크립트로 한 번,
      # Flyway 로 또 한 번 적용돼서 마이그레이션 이력이 어긋난다. 되살리지 말 것.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alldap -d alldap"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 로컬 관측 스택 (부하테스트용) ───────────────────────────────────
  # 🔴 profiles 로 격리한다. `docker compose up -d` 는 예전처럼 db 만 띄우고,
  #    관측이 필요할 때만 `docker compose --profile obs up -d` 로 켠다.
  #    평소 개발에 250MB 를 상시로 물릴 이유가 없다.
  # 운영(docker-compose.prod.yml)에는 이 둘이 <없다.> t3.micro 는 유휴에 이미 스왑을 쓴다.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: alldap-prometheus
    profiles: [obs]
    ports:
      # db 와 같은 이유로 127.0.0.1 에 묶는다. 사내망의 누구나 지표를 읽으면 안 된다.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # 리눅스에서는 host.docker.internal 이 기본 제공되지 않는다. 이 줄이 그걸 메운다.
      # (맥 Docker Desktop 에서는 이미 되지만, 있어도 무해하다)
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: alldap-grafana
    profiles: [obs]
    depends_on:
      - prometheus
    ports:
      # 🔴 3001 이다. 3000 은 Next.js 개발 서버가 쓴다.
      - "127.0.0.1:3001:3000"
    environment:
      # 로컬 전용이라 로그인을 끈다. 부하테스트 중에 로그인 화면을 보고 싶지 않다.
      # 운영에는 이 스택 자체가 없으므로 이 설정이 새어 나갈 곳이 없다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - alldap-grafana:/var/lib/grafana

volumes:
  alldap-pgdata:
  # Grafana 의 내부 SQLite. 대시보드 자체는 프로비저닝 파일이 진실이지만,
  # 이게 없으면 재기동마다 Grafana 가 초기화 로그를 잔뜩 뱉는다.
  alldap-grafana:
