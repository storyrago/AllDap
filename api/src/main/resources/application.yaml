# AllDap Spring API — 로컬 개발 기본 프로파일
#
# 값 주입 규칙: ${환경변수:로컬기본값}
#   로컬에서는 docker-compose.yml 의 alldap/alldap/alldap 을 그대로 쓰고,
#   운영에서는 application-prod.yaml 이 기본값 없이 환경변수를 강제한다(fail-closed).

spring:
  application:
    name: alldap-api

  datasource:
    # docker-compose.yml 의 db 서비스와 동일한 값
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alldap}
    username: ${DB_USERNAME:alldap}
    password: ${DB_PASSWORD:alldap}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # ⚠️ 절대 update/create 로 바꾸지 말 것.
      # Python AI 서비스(:8001)와 DB 를 공유하므로 Hibernate 가 스키마를 건드리면
      # documents/chunks 를 쓰는 Python 쪽이 깨진다.
      # 스키마의 단일 진실 공급원은 Flyway 마이그레이션(db/migration)이다.
      ddl-auto: validate
    # 컨트롤러/뷰까지 영속성 컨텍스트를 열어두지 않는다.
    # 커넥션을 요청 끝까지 붙잡아 두면 Python 호출(수십 초)이 섞였을 때 커넥션 풀이 마른다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # 마이그레이션 SQL 위치: src/main/resources/db/migration/V{n}__{설명}.sql
    locations: classpath:db/migration

  servlet:
    multipart:
      # Python(ai-service/app/config.py)의 upload_max_bytes 20MB 와 맞춘다.
      # 한쪽만 크게 잡으면 Spring 을 통과한 파일이 Python 에서 413 으로 거절된다.
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  tomcat:
    mbeanregistry:
      # 🔴 이게 없으면 tomcat.threads.* 지표가 <에러 없이 그냥 안 나온다.>
      #    부하테스트의 1순위 판정 근거가 "스레드가 몇 개 바쁜가" 라서 반드시 켠다.
      #    비용은 MBean 등록 몇 개다.
      enabled: true

management:
  server:
    # 🔴 서비스 포트(8080)와 <분리>한다. 이유는 두 가지다.
    #   ① 운영에서 actuator 를 껐다 켜는 편법 없이 상시 켜둘 수 있다.
    #      안전한 근거는 docker-compose.prod.yml 이 8081 을 ports: 에 안 여는 것이다.
    #      "방화벽으로 막는다" 가 아니라 애초에 호스트에 뜨지 않게 하는 쪽이 강하다.
    #      (Spring Security 규칙 한 줄의 오타에 기대는 것보다 훨씬 강하다)
    #   ② 부하테스트 중 서비스 포트가 포화돼도 지표는 계속 긁힌다.
    #      같은 포트면 톰캣 스레드가 마르는 순간 관측도 함께 멎어, 정작 알고 싶은
    #      "포화된 순간" 의 지표가 비어버린다.
    # ✅ 이 포트에도 SecurityConfig 의 필터 체인이 <붙는다>. 별도 자식 컨텍스트인데도 Boot 4 가
    #    부모의 SecurityFilterChain 을 자식에 등록한다(문서로 확언할 수 없어 실측했다 —
    #    ManagementPortIntegrationTest). 그래서 /actuator/metrics 는 인증 없이 부르면 401 이고,
    #    Prometheus 가 긁을 수 있도록 SecurityConfig 에서 /actuator/prometheus 만 permitAll 로 열었다.
    #    ⚠️ 그래도 방어를 필터 체인 하나에 기대지 않는다. docker-compose.prod.yml 이 이 포트를
    #       ports: 에 안 여는 것이 여전히 첫 번째 방어선이다(규칙 한 줄의 오타보다 강하다).
    port: 8081
  prometheus:
    metrics:
      export:
        # 🔴 Boot 4 부터 지표 <내보내기>가 기본으로 꺼져 있다(management.defaults.metrics.export.enabled).
        #    켜지 않으면 PrometheusMetricsExportAutoConfiguration 이 아예 안 돌아
        #    /actuator/prometheus 가 <에러 없이 그냥 없는 경로>가 된다(exposure 에 적어도 소용없다).
        #    Boot 3 예제를 그대로 옮기면 여기서 막힌다. 실측으로 확인했다.
        enabled: true
  endpoints:
    web:
      exposure:
        # 포트가 분리돼 인터넷에서 닿지 않으므로 부하테스트에 필요한 만큼 연다.
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        # p95·p99 를 Grafana 에서 계산하려면 히스토그램 버킷이 필요하다.
        # 이게 없으면 count/sum 만 나와 <평균밖에> 못 그린다.
        # 평균은 느린 꼬리를 감춘다(avg_faithfulness 로 이미 데인 부류다).
        http.server.requests: true

app:
  ai-service:
    # Python AI 서비스. 내부망 전용이라 외부에 노출하지 않는다.
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
    # 타임아웃 근거는 RestClientConfig 의 주석 참고.
    connect-timeout: 3s
    read-timeout: 120s
    # ── 재시도 · 서킷브레이커 ────────────────────────────────────────
    # ⚠️ 재시도는 <연결 실패에만> 적용된다. 요청이 도달하지 않은 것이 확실한 유일한 경우라
    #    부작용(문서 행 중복·LLM 중복 과금)이 없다. 자세한 근거는 AiServiceClient 주석.
    #
    # 값의 근거는 얕다 — 실측이 아니라 판단이다:
    #   retry-max-attempts 2   Python 재시작 중이면 1회 더로 대개 붙는다. 더 늘리면
    #                          사용자 대기(연결 타임아웃 3초 × 시도 수)가 그만큼 길어진다.
    #   retry-delay 200ms      프로세스가 포트를 잡는 데 걸리는 시간 정도. 사용자가 체감하지 않는다.
    #   circuit-failure-threshold 5   일시적 흔들림 몇 번으로 열리면 안 된다.
    #   circuit-open-duration 30s     Python 재시작이 대개 그 안에 끝난다.
    retry-max-attempts: 2
    retry-delay: 200ms
    circuit-failure-threshold: 5
    circuit-open-duration: 30s
  toss:
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    # 🔴 기본값을 두지 않는다. 토스 대시보드에서 발급받은 <API 개별 연동 키>(test_sk_...)를
    #    TOSS_SECRET_KEY 환경변수로 넣을 것. 결제위젯 키(test_gsk_)는 거부된다.
    #    비워두면 토스가 401 을 주고, TossClient 가 그걸 <우리 설정 문제>로 분류해
    #    503 + 서버 로그 ERROR 로 알린다(사용자에게 "카드를 확인하세요" 라고 하지 않는다).
    secret-key: ${TOSS_SECRET_KEY:}
    # 타임아웃 근거는 TossClientConfig 주석. AI 서비스(3s/120s)와 <일부러 다르다>.
    connect-timeout: 3s
    read-timeout: 10s
  billing-crypto:
    # 토스 빌링키를 DB 에 넣기 전 암호화하는 AES-256 키. Base64 로 인코딩한 32바이트다.
    # ⚠️ 아래 기본값은 로컬 전용이다. 운영에서는 반드시 BILLING_CRYPTO_KEY 를 주입할 것.
    #    (application-prod.yaml 은 기본값 없이 환경변수를 강제한다)
    # 이 값을 바꾸면 BillingCrypto.KNOWN_LOCAL_DEFAULT_KEY 도 함께 바꿀 것 —
    # "공개된 기본값으로 운영에 뜨는 것"을 막는 기동 가드가 이 문자열을 비교한다.
    # 🔴 그리고 이 키를 바꾸면 <이미 저장된 카드는 복호화되지 않는다.> 토스에 조회 API 가 없어
    #    우리 DB 가 유일한 사본이라, 바꾸는 순간 그 고객들은 카드를 다시 등록해야 한다.
    # 생성: openssl rand -base64 32
    key: ${BILLING_CRYPTO_KEY:YWxsZGFwLWxvY2FsLWRldi1iaWxsaW5nLWtleS0zMmI=}
  jwt:
    # ⚠️ 아래 기본값은 로컬 전용이다. 운영에서는 반드시 JWT_SECRET 을 주입할 것.
    #    (application-prod.yaml 은 기본값 없이 환경변수를 강제한다)
    #    HS256 은 최소 256비트 키가 필요해 기본값을 길게 잡아뒀다.
    #    이 값을 바꾸면 JwtService.KNOWN_LOCAL_DEFAULT_SECRET 도 함께 바꿀 것 —
    #    "공개된 기본값으로 운영에 뜨는 것"을 막는 기동 가드가 이 문자열을 비교한다.
    secret: ${JWT_SECRET:alldap-local-dev-only-secret-key-do-not-use-in-production-0123456789}
    access-token-ttl: 24h
  widget:
    # 위젯은 인증 없이 열려 있는 유일한 문이라 요청 수 제한이 실질적 방어선이다.
    # 채팅은 건당 LLM 비용이 들어 낮게, 설정 조회는 비용이 없어 넉넉히 잡는다.
    # (제한기의 한계 — 인스턴스가 늘면 각자 세므로 실질 한도가 배가 된다 — 는 RateLimiter 주석 참고)
    chat-per-minute: ${WIDGET_CHAT_PER_MINUTE:20}
    config-per-minute: ${WIDGET_CONFIG_PER_MINUTE:60}
    # 로그인 시도 제한. 키는 <IP> 다 — 이메일로 잡으면 남의 계정을 잠글 수 있다.
    # 10 인 근거: 사람이 비밀번호를 잘못 치는 횟수로는 넉넉하고,
    # 흔한 비밀번호 목록 대입에는 턱없이 부족하다. ⚠️ 실측으로 조정할 값이다.
    login-per-minute: ${LOGIN_PER_MINUTE:10}
    # 연속 로그인 실패 제한. 키가 <IP + 이메일> 이라 위의 login-per-minute(IP 만)과 세는 대상이 다르다.
    # 위 제한만으로는 분당 10회를 <영원히> 이어갈 수 있어(하루 14,400회) 흔한 비밀번호 목록 대입을 못 막는다.
    # 5 인 근거: 사람이 연속으로 틀리는 횟수로는 넉넉하고(성공하면 카운터가 지워진다),
    # 15분 창(AuthService.FAILURE_WINDOW)과 합치면 계정당 시간당 20회로 묶인다. ⚠️ 실측으로 조정할 값이다.
    login-failure-limit: ${LOGIN_FAILURE_LIMIT:5}
  cors:
    # 관리자 화면(Next.js)이 떠 있는 오리진. 브라우저는 포트가 다르면 다른 출처로 본다.
    # 여러 개면 쉼표로 구분한다. 예: CORS_ALLOWED_ORIGINS=https://a.example.com,https://b.example.com
    # 위젯(/api/w/**)은 봇마다 허용 도메인이 달라 여기가 아니라 별도로 처리한다(SecurityConfig 주석 참고).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.alldap.api: DEBUG
