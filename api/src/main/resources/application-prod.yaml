# AllDap Spring API — 운영 프로파일 (SPRING_PROFILES_ACTIVE=prod)
#
# 설계 원칙: fail-closed.
#   여기에는 기본값을 두지 않는다. 환경변수가 없으면 기동 자체가 실패해야 한다.
#   기본값을 남겨두면 "운영에 로컬 비밀번호로 붙는" 사고가 조용히 일어난다.
#   차라리 시끄럽게 죽는 편이 안전하다.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 로컬과 동일하게 validate. Python 과 DB 를 공유하므로 예외 없다.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # 환경변수로 뺀 이유: 작은 서버에서 이게 <OOM 방아쇠>다.
      # Python 이 PDF 를 파싱할 때 pymupdf 가 파일을 통째로 메모리에 올려서,
      # 1GB 머신이면 20MB 짜리 하나에 수백 MB 가 순간적으로 뛴다.
      # 문제가 났을 때 이미지를 다시 빌드하지 않고 값만 낮출 수 있어야 한다.
      # ⚠️ 낮출 때는 ai-service 의 UPLOAD_MAX_BYTES 도 <함께> 낮출 것.
      #    한쪽만 낮추면 Spring 은 통과시키고 Python 이 413 을 주는 엇갈림이 난다.
      max-file-size: ${UPLOAD_MAX_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_SIZE:20MB}

server:
  port: ${SERVER_PORT:8080}
  # 리버스 프록시(Caddy) 뒤에서 돈다. X-Forwarded-* 를 신뢰하지 않으면
  # 요청자 IP 가 전부 <프록시의 IP> 로 보인다.
  # 위젯 채팅의 rate limit 이 IP 기준이라, 그대로 두면 전 세계가
  # 한 바구니에서 한도를 나눠 쓰게 된다.
  #
  # 🔴 이 전략은 X-Forwarded-For 만 보는 게 아니다. Spring 의 ForwardedHeaderUtils 는
  #    RFC 7239 `Forwarded` 를 <먼저> 읽는다. 그런데 Caddy 는 X-Forwarded-* 와 달리
  #    `Forwarded` 를 손대지 않고 그대로 넘긴다(caddy 2.11.4 실측).
  #    → 그대로 두면 클라이언트가 `Forwarded: for=...` 로 getRemoteAddr() 을 위조할 수 있고,
  #      IP 기준 rate limit 이 요청마다 다른 키가 되어 무력화된다.
  #    그래서 Caddyfile 에 `header_up -Forwarded` 를 넣었다.
  #    ⚠️ 그 한 줄이 이 설정의 전제다. Caddyfile 을 고칠 때 함께 볼 것.
  #    (caddy:2-alpine 이 가리키는 2.11.4 로 실측: 불신 상대의 X-Forwarded-* 는 잇지 않고
  #     <버린다>. 그쪽은 이 버전에서는 원래 안전했다 — 2.7 의 trusted_proxies 도입이
  #     원인이라 추정하지만, 그 버전 경계 자체는 확인하지 않았다. 배포 이미지가 2-alpine
  #     이라 미래 버전이 이 동작을 유지하는지도 매번 실측해야 한다)
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      # tomcat.threads.* 지표. 근거는 application.yaml 의 같은 항목 주석 참고.
      enabled: true

management:
  server:
    # 🔴 운영에서도 켠다. 안전한 근거는 <포트를 안 여는 것>이다.
    #    docker-compose.prod.yml 의 api 서비스에 ports: 가 없어 이 포트는 호스트에 뜨지 않고,
    #    Caddy 는 api:8080 만 안다. ai-service 에 ports: 를 안 쓰는 것과 같은 논리다.
    # ✅ 이 포트에도 SecurityConfig 필터 체인이 붙는다(ManagementPortIntegrationTest 실측).
    #    /actuator/metrics 는 401 이고, /actuator/prometheus 만 permitAll 이라 인증 없이 읽힌다.
    # ⚠️ 그 permitAll 때문에라도 api 서비스에 ports: 를 추가하지 말 것.
    #    추가하는 순간 스크레이프가 인터넷에 열린다.
    port: ${MANAGEMENT_SERVER_PORT:8081}
  prometheus:
    metrics:
      export:
        # Boot 4 는 지표 내보내기가 기본으로 꺼져 있다. 근거는 application.yaml 의 같은 항목 주석 참고.
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  ai-service:
    # Python 서비스 주소. 반드시 내부망 주소여야 한다.
    # 이 주소가 외부에 열려 있으면 인증 없이 누구나 남의 봇 문서를 조회할 수 있다.
    base-url: ${AI_SERVICE_BASE_URL}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:120s}
  toss:
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    # ⚠️ 이 파일 머리의 fail-closed 원칙이 <적용되지 않는> 값이다. TossProperties 는
    # @Validated·@NotBlank 가 없는 순수 record 라, 이 값이 비어 있어도(또는 docker-compose 가
    # 빈 문자열을 그대로 주입해도) 기동을 막지 않는다 — TossClientConfig 가 그 값을 그대로 받아
    # 인증 헤더를 만든다. 비면 토스가 401 을 주고 TossClient 가 그걸 503 으로 바꿔 내보내므로,
    # 증상은 배포 시점이 아니라 <사용자가 카드를 등록할 때> 나타난다("떴으니 됐다"로 읽으면
    # 안 되는 값이다 — docs/DEPLOY.md §7 참고). TODO: BillingCrypto 처럼 시작 시 가드를 추가할
    # 수 있다 — 동작을 바꾸는 것은 별도 슬라이스다.
    secret-key: ${TOSS_SECRET_KEY}
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:3s}
    read-timeout: ${TOSS_READ_TIMEOUT:10s}
  billing-crypto:
    # 🔴 기본값을 두지 않는다. 이 파일의 fail-closed 원칙 그대로다 —
    #    공개된 로컬 키로 운영에 뜨면 DB 를 손에 넣은 사람이 전 고객의 빌링키를 복호화한다.
    #    (BillingCrypto 생성자에도 같은 가드가 있다. 두 겹으로 둔 이유는
    #     프로파일을 깜빡하고 배포하면 이 파일 자체가 안 읽히기 때문이다)
    # 🔴 한 번 정하면 바꿀 수 없다. 바꾸는 순간 이미 등록된 카드가 전부 복호화 불가가 된다.
    key: ${BILLING_CRYPTO_KEY}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:24h}
  cors:
    # 관리자 화면의 실제 배포 주소. 기본값을 두지 않는다(fail-closed) —
    # 로컬 주소가 운영에 남아 있는 것보다 기동이 실패하는 편이 안전하다.
    # 스킴·호스트·포트가 정확히 일치해야 한다. 여러 개면 쉼표로 구분한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 🔴 운영에서는 API 문서를 내보내지 않는다. 이것이 노출 방어 두 겹 중 <①> 이다.
#    ② 는 SecurityConfig 가 문서 경로에 permitAll 을 걸지 않는 것(프로파일 분기).
#    한 겹만 두면 우회 경로가 생겨 규칙이 없는 것과 같아진다:
#      · ① 만 두면 나중에 누가 이 설정을 되돌리는 순간 전부 열린다.
#      · ② 만 두면 문서는 계속 생성되면서 401 뒤에 숨어 있을 뿐이라 계정 하나만 있으면 읽힌다.
#    두 겹이 각각 동작하는 것은 OpenApiProdExposureIntegrationTest 가 CI 에서 확인한다
#    (토큰 없이 401 = ②, 토큰 붙여 404 = ①).
#
# ⚠️ 문서는 로컬에서만 본다. 전시가 목적인데 운영에서 못 보는 것은 목적과 일부 상충하지만,
#    노출 판단을 나중에 되돌리는 쪽이 그 반대보다 안전하다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.alldap.api: INFO
