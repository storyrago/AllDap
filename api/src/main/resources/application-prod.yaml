# AllDap Spring API — 운영 프로파일 (SPRING_PROFILES_ACTIVE=prod)
#
# 설계 원칙: fail-closed.
#   여기에는 기본값을 두지 않는다. 환경변수가 없으면 기동 자체가 실패해야 한다.
#   기본값을 남겨두면 "운영에 로컬 비밀번호로 붙는" 사고가 조용히 일어난다.
#   차라리 시끄럽게 죽는 편이 안전하다.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 로컬과 동일하게 validate. Python 과 DB 를 공유하므로 예외 없다.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # 환경변수로 뺀 이유: 작은 서버에서 이게 <OOM 방아쇠>다.
      # Python 이 PDF 를 파싱할 때 pymupdf 가 파일을 통째로 메모리에 올려서,
      # 1GB 머신이면 20MB 짜리 하나에 수백 MB 가 순간적으로 뛴다.
      # 문제가 났을 때 이미지를 다시 빌드하지 않고 값만 낮출 수 있어야 한다.
      # ⚠️ 낮출 때는 ai-service 의 UPLOAD_MAX_BYTES 도 <함께> 낮출 것.
      #    한쪽만 낮추면 Spring 은 통과시키고 Python 이 413 을 주는 엇갈림이 난다.
      max-file-size: ${UPLOAD_MAX_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_SIZE:20MB}

server:
  port: ${SERVER_PORT:8080}
  # 리버스 프록시(Caddy) 뒤에서 돈다. X-Forwarded-* 를 신뢰하지 않으면
  # 요청자 IP 가 전부 <프록시의 IP> 로 보인다.
  # 위젯 채팅의 rate limit 이 IP 기준이라, 그대로 두면 전 세계가
  # 한 바구니에서 한도를 나눠 쓰게 된다.
  #
  # 🔴 이 전략은 X-Forwarded-For 만 보는 게 아니다. Spring 의 ForwardedHeaderUtils 는
  #    RFC 7239 `Forwarded` 를 <먼저> 읽는다. 그런데 Caddy 는 X-Forwarded-* 와 달리
  #    `Forwarded` 를 손대지 않고 그대로 넘긴다(caddy 2.11.4 실측).
  #    → 그대로 두면 클라이언트가 `Forwarded: for=...` 로 getRemoteAddr() 을 위조할 수 있고,
  #      IP 기준 rate limit 이 요청마다 다른 키가 되어 무력화된다.
  #    그래서 Caddyfile 에 `header_up -Forwarded` 를 넣었다.
  #    ⚠️ 그 한 줄이 이 설정의 전제다. Caddyfile 을 고칠 때 함께 볼 것.
  #    (caddy:2-alpine 이 가리키는 2.11.4 로 실측: 불신 상대의 X-Forwarded-* 는 잇지 않고
  #     <버린다>. 그쪽은 이 버전에서는 원래 안전했다 — 2.7 의 trusted_proxies 도입이
  #     원인이라 추정하지만, 그 버전 경계 자체는 확인하지 않았다. 배포 이미지가 2-alpine
  #     이라 미래 버전이 이 동작을 유지하는지도 매번 실측해야 한다)
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  ai-service:
    # Python 서비스 주소. 반드시 내부망 주소여야 한다.
    # 이 주소가 외부에 열려 있으면 인증 없이 누구나 남의 봇 문서를 조회할 수 있다.
    base-url: ${AI_SERVICE_BASE_URL}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:120s}
  toss:
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    # fail-closed. 기본값을 두지 않는다 — 키 없이 뜨면 카드 등록이 전부 실패하는데
    # 원인이 로그를 뒤져야 나온다. 차라리 기동이 실패하는 편이 안전하다.
    secret-key: ${TOSS_SECRET_KEY}
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:3s}
    read-timeout: ${TOSS_READ_TIMEOUT:10s}
  billing-crypto:
    # 🔴 기본값을 두지 않는다. 이 파일의 fail-closed 원칙 그대로다 —
    #    공개된 로컬 키로 운영에 뜨면 DB 를 손에 넣은 사람이 전 고객의 빌링키를 복호화한다.
    #    (BillingCrypto 생성자에도 같은 가드가 있다. 두 겹으로 둔 이유는
    #     프로파일을 깜빡하고 배포하면 이 파일 자체가 안 읽히기 때문이다)
    # 🔴 한 번 정하면 바꿀 수 없다. 바꾸는 순간 이미 등록된 카드가 전부 복호화 불가가 된다.
    key: ${BILLING_CRYPTO_KEY}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:24h}
  cors:
    # 관리자 화면의 실제 배포 주소. 기본값을 두지 않는다(fail-closed) —
    # 로컬 주소가 운영에 남아 있는 것보다 기동이 실패하는 편이 안전하다.
    # 스킴·호스트·포트가 정확히 일치해야 한다. 여러 개면 쉼표로 구분한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.alldap.api: INFO
