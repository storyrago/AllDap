plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.alldap'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus 스크레이프 포맷(/actuator/prometheus)을 내보낸다.
	// 버전은 Boot 의 dependency-management 가 관리하므로 적지 않는다(적으면 Boot 를 올릴 때 어긋난다).
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// DB 스키마 마이그레이션.
	// 마이그레이션 SQL 위치: src/main/resources/db/migration/V{n}__{설명}.sql
	// 스키마를 바꿀 때는 V1을 수정하지 말고 V2, V3... 을 새로 추가한다.
	// (이미 적용된 마이그레이션 파일을 수정하면 체크섬이 어긋나 기동이 실패한다.)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'

	// ── 통합 테스트: Testcontainers ────────────────────────────────────────
	// 테스트가 진짜 PostgreSQL(+pgvector) 컨테이너를 띄워 돌아간다.
	// H2 같은 인메모리 DB 를 쓰지 않는 이유: 스키마의 단일 진실 공급원이 Flyway 마이그레이션인데
	// V1__init.sql 이 CREATE EXTENSION vector, TEXT[], JSONB, gen_random_uuid() 등
	// PostgreSQL 전용 문법을 쓴다. H2 로는 마이그레이션 자체가 돌지 않는다.
	// (즉 "테스트는 통과하는데 운영에서 깨지는" 상황을 구조적으로 막는 선택이다.)
	//
	// ⚠️ Boot 4 는 Testcontainers 2.x 를 쓴다. 모듈 이름이 전부 'testcontainers-' 접두사로 바뀌었다.
	//    1.x: org.testcontainers:postgresql      / org.testcontainers:junit-jupiter
	//    2.x: org.testcontainers:testcontainers-postgresql / :testcontainers-junit-jupiter
	//    1.x 이름을 그대로 쓰면 "Could not find org.testcontainers:postgresql" 로 의존성 해석이 실패한다.
	//
	// junit-jupiter 모듈(@Testcontainers/@Container)은 넣지 않았다.
	// 컨테이너 생명주기를 Boot 의 @ServiceConnection(spring-boot-testcontainers)이 대신 관리하기 때문이다.
	// 두 방식을 섞으면 누가 컨테이너를 띄우고 내리는지가 불분명해진다. 자세한 근거는
	// src/test/java/com/alldap/api/support/TestcontainersConfiguration.java 주석 참고.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

/*
 * 위젯 로더 스크립트를 Spring 의 정적 리소스로 함께 담는다.
 *
 * 왜 필요한가: 봇 설정 화면이 안내하는 설치 코드가
 *   <script src="http://.../widget/alldap-widget.js" data-public-key="..."></script>
 * 인데, 이 복사가 실제로 동작하려면 그 주소에서 파일이 나와야 한다.
 * (실행해보고 401 이 나서 알았다 — 파일이 저장소 루트의 widget/ 에만 있었다)
 *
 * 왜 파일을 복사해 두 벌로 만들지 않았나: 원본은 widget/ 하나뿐이고
 * 빌드할 때만 결과물에 담는다. 소스에 사본이 생기면 반드시 한쪽만 고쳐져 어긋난다.
 */
processResources {
	from("${projectDir}/../widget") {
		include 'alldap-widget.js'
		into 'static/widget'
	}
}
