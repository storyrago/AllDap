plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.alldap'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus 스크레이프 포맷(/actuator/prometheus)을 내보낸다.
	// 버전은 Boot 의 dependency-management 가 관리하므로 적지 않는다(적으면 Boot 를 올릴 때 어긋난다).
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// ── API 문서 (Swagger UI / OpenAPI) ──────────────────────────────────
	// 🔴 버전을 직접 적는다. Boot 의 dependency-management 가 관리하지 않는 서드파티다.
	//
	// 🔴 이 버전은 <Boot 3 계열(3.4.4)을 부모로 삼아> 빌드됐다. springdoc 3.x 는 존재하지 않는다
	//    (2026-09-12 Maven Central 확인 결과 2.8.6 이 최신). 즉 Boot 4 호환이 <보장된 것이 아니라
	//    우연히 맞는 것>이고, Boot 를 올릴 때 깨질 수 있으며 그때 후퇴할 곳이 없다. 알고 택했다.
	//    근거와 실측 결과: docs/superpowers/specs/2026-09-12-swagger-design.md
	//
	// ⚠️ 운영에서는 문서를 내보내지 않는다. 막는 곳이 두 군데다:
	//      ① application-prod.yaml 의 springdoc.*.enabled: false   (문서 생성 자체를 끈다)
	//      ② SecurityConfig 의 프로파일 분기                        (경로를 인증 뒤에 둔다)
	//    한쪽만 두면 우회 경로가 생겨 규칙이 없는 것과 같아진다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// DB 스키마 마이그레이션.
	// 마이그레이션 SQL 위치: src/main/resources/db/migration/V{n}__{설명}.sql
	// 스키마를 바꿀 때는 V1을 수정하지 말고 V2, V3... 을 새로 추가한다.
	// (이미 적용된 마이그레이션 파일을 수정하면 체크섬이 어긋나 기동이 실패한다.)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'

	// ── 통합 테스트: Testcontainers ────────────────────────────────────────
	// 테스트가 진짜 PostgreSQL(+pgvector) 컨테이너를 띄워 돌아간다.
	// H2 같은 인메모리 DB 를 쓰지 않는 이유: 스키마의 단일 진실 공급원이 Flyway 마이그레이션인데
	// V1__init.sql 이 CREATE EXTENSION vector, TEXT[], JSONB, gen_random_uuid() 등
	// PostgreSQL 전용 문법을 쓴다. H2 로는 마이그레이션 자체가 돌지 않는다.
	// (즉 "테스트는 통과하는데 운영에서 깨지는" 상황을 구조적으로 막는 선택이다.)
	//
	// ⚠️ Boot 4 는 Testcontainers 2.x 를 쓴다. 모듈 이름이 전부 'testcontainers-' 접두사로 바뀌었다.
	//    1.x: org.testcontainers:postgresql      / org.testcontainers:junit-jupiter
	//    2.x: org.testcontainers:testcontainers-postgresql / :testcontainers-junit-jupiter
	//    1.x 이름을 그대로 쓰면 "Could not find org.testcontainers:postgresql" 로 의존성 해석이 실패한다.
	//
	// junit-jupiter 모듈(@Testcontainers/@Container)은 넣지 않았다.
	// 컨테이너 생명주기를 Boot 의 @ServiceConnection(spring-boot-testcontainers)이 대신 관리하기 때문이다.
	// 두 방식을 섞으면 누가 컨테이너를 띄우고 내리는지가 불분명해진다. 자세한 근거는
	// src/test/java/com/alldap/api/support/TestcontainersConfiguration.java 주석 참고.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

/*
 * 위젯 로더 스크립트를 Spring 의 정적 리소스로 함께 담는다.
 *
 * 왜 필요한가: 봇 설정 화면이 안내하는 설치 코드가
 *   <script src="http://.../widget/alldap-widget.js" data-public-key="..."></script>
 * 인데, 이 복사가 실제로 동작하려면 그 주소에서 파일이 나와야 한다.
 * (실행해보고 401 이 나서 알았다 — 파일이 저장소 루트의 widget/ 에만 있었다)
 *
 * 왜 파일을 복사해 두 벌로 만들지 않았나: 원본은 widget/ 하나뿐이고
 * 빌드할 때만 결과물에 담는다. 소스에 사본이 생기면 반드시 한쪽만 고쳐져 어긋난다.
 */
processResources {
	from("${projectDir}/../widget") {
		include 'alldap-widget.js'
		into 'static/widget'
	}
}

/*
 * 부하테스트용: 로컬 bootRun 을 <운영과 같은 자원 한도>로 돌린다.
 *
 * 왜 필요한가 — 이게 없으면 가설 하나가 링에 오르지도 못한다
 * ─────────────────────────────────────────────────────────────────────────
 * S2(breakpoint)가 판정해야 하는 가설은 둘이다:
 *   1순위 — Python anyio 스레드풀 40 이 먼저 찬다
 *   2순위 — 그보다 Spring 힙 256m 이 먼저 마른다
 * 그런데 로컬 Spring 은 컨테이너 밖(맥 호스트)에서 gradle 로 돈다
 * (observability/prometheus.yml 주석 참고). 즉 JVM 기본 힙 = 맥 RAM 의 1/4 로,
 * 기가 단위다. 그대로 재면 힙은 <절대 안 마르고> 결론은 언제나 "Python 이 먼저다" 가 된다 —
 * 그게 사실이어서가 아니라 <상대 가설을 링에 올리지도 않았기> 때문에.
 * 부하테스트의 목적은 맞히는 게 아니라 틀리는 걸 보는 것이다.
 *
 * 🔴 -Ploadtest 옵트인이다. 무조건 걸면 평소 개발에서도 힙이 256m 이 되어
 *    문서 업로드·임베딩이 엉뚱하게 죽는다. 측정을 위한 제약이 일상을 망가뜨리는 자리라
 *    조건을 붙인다.
 *
 * 실행: ./gradlew bootRun -Ploadtest
 */
tasks.named('bootRun') {
	if (project.hasProperty('loadtest')) {
		// 🔴 docker-compose.prod.yml 의 JAVA_OPTS 와 <반드시 같은 값이어야 한다.>
		//    한쪽만 바뀌면 로컬이 운영을 대변하지 못하게 되는데, 그게 <조용히> 일어난다
		//    (provenance: false 를 같은 방식으로 처리한 선례가 있다).
		//    거기를 고치는 사람이 여기를 보게 하려고 양쪽에 서로를 가리키는 주석을 뒀다.
		jvmArgs = [
			'-Xms192m',
			'-Xmx256m',
			'-XX:MaxMetaspaceSize=128m',
			'-XX:+ExitOnOutOfMemoryError',
		]

		// 🔴 optimizedLaunch 를 끈다. bootRun 은 기본으로 -XX:TieredStopAtLevel=1 을 붙여
		//    JIT 을 C1 에서 멈춘다(기동을 1초쯤 줄이려는 옵션이다. 플러그인 4.0.7 의
		//    BootRun.class 를 열어 확인했다).
		//    12분 동안 수천 건을 처리하는 측정에서 이걸 켜두면 <운영보다 훨씬 느린 JVM>을 재게 되고,
		//    "어디서 꺾이는가" 가 통째로 아래 단계로 밀린다. 그 숫자가 이 PR 의 산출물이다.
		//    측정에서는 기동 1초보다 정확한 곡선이 중요하다.
		optimizedLaunch = false
	}
}
