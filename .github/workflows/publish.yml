name: Publish images

# 왜 별도 워크플로인가
# ─────────────────────────────────────────────────────────────────────────────
# ci.yml 은 "이 변경이 깨졌나" 를 본다(PR 마다). 이 파일은 "배포할 물건을 만든다"
# 이므로 트리거도(main 에 들어간 뒤) 권한도(패키지 쓰기) 다르다. 섞으면 PR 마다
# 이미지를 밀거나, CI 에 쓰기 권한을 상시로 주게 된다.
#
# 🔴 왜 CI 에서 빌드하나 — 서버에서 못 하기 때문이다.
# 배포 대상이 EC2 `t3.micro`(1GB)라 거기서 `docker compose --build` 를 돌리면
# Gradle 컴파일이 OOM 으로 죽는다. 그래서 이미지는 여기서 만들어 GHCR 에 올리고,
# 서버는 `pull` 만 한다. 부수 효과로 서버에 JDK·Gradle 을 둘 필요가 없어졌고,
# 배포가 몇 초로 줄었으며, IMAGE_TAG 를 이전 SHA 로 바꾸면 즉시 롤백된다.
#
# ⚠️ 아키텍처는 linux/amd64 다. t3 는 Intel/AMD x86_64 이고,
#    개발 머신(Apple Silicon)에서 만든 arm64 이미지는 거기서 실행되지 않는다.
#    Graviton(t4g)으로 옮기면 여기를 linux/arm64 로 바꿔야 한다.

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'ai-service/**'
      - 'widget/**'          # 위젯 JS 가 Spring 이미지 안으로 들어간다
      - '.github/workflows/publish.yml'
  # 코드 변경 없이 다시 밀고 싶을 때(태그 갱신·실패 재시도)를 위해 수동 실행도 연다.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # 워크플로 기본은 읽기 전용이다(ci.yml 주석 참고).
    # 쓰기가 필요한 이 잡에만 개별로 준다.
    permissions:
      contents: read
      packages: write
    strategy:
      # 하나가 실패해도 나머지는 끝까지 민다. 둘 다 다시 돌리는 것보다 싸다.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: ai-service
            dockerfile: ai-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # ⚠️ 컨텍스트가 저장소 루트다. api/build.gradle 의 processResources 가
          #    ../widget 을 읽어 위젯 로더를 JAR 에 담기 때문이다.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # latest 와 커밋 SHA 둘 다 붙인다.
          # 서버는 보통 latest 를 쓰지만, 문제가 생겼을 때 <어느 커밋으로> 되돌릴지
          # 지정할 수 있어야 롤백이 가능하다.
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          # 러너는 매번 새 머신이라 캐시가 없다. GitHub Actions 캐시에 레이어를 남겨
          # 다음 빌드에서 Gradle 의존성 내려받기를 건너뛴다.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
