name: Publish images

# 왜 별도 워크플로인가
# ─────────────────────────────────────────────────────────────────────────────
# ci.yml 은 "이 변경이 깨졌나" 를 본다(PR 마다). 이 파일은 "배포할 물건을 만든다"
# 이므로 트리거도(main 에 들어간 뒤) 권한도(패키지 쓰기) 다르다. 섞으면 PR 마다
# 이미지를 밀거나, CI 에 쓰기 권한을 상시로 주게 된다.
#
# 🔴 왜 CI 에서 빌드하나 — 서버에서 못 하기 때문이다.
# 배포 대상이 EC2 `t3.micro`(1GB)라 거기서 `docker compose --build` 를 돌리면
# Gradle 컴파일이 OOM 으로 죽는다. 그래서 이미지는 여기서 만들어 GHCR 에 올리고,
# 서버는 `pull` 만 한다. 부수 효과로 서버에 JDK·Gradle 을 둘 필요가 없어졌고,
# 배포가 몇 초로 줄었으며, IMAGE_TAG 를 이전 SHA 로 바꾸면 즉시 롤백된다.
#
# ⚠️ 아키텍처는 linux/amd64 다. t3 는 Intel/AMD x86_64 이고,
#    개발 머신(Apple Silicon)에서 만든 arm64 이미지는 거기서 실행되지 않는다.
#    Graviton(t4g)으로 옮기면 여기를 linux/arm64 로 바꿔야 한다.

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'ai-service/**'
      - 'widget/**'          # 위젯 JS 가 Spring 이미지 안으로 들어간다
      - '.github/workflows/publish.yml'
      # 🔴 아래 셋은 이미지 내용과 무관하다. 그래도 여기 있는 이유는
      #    <배포(deploy.yml)가 이 워크플로의 성공에만 딸려 있기 때문>이다.
      #    Caddyfile 은 bind mount 라 서버 디스크의 파일이 곧 설정이고, compose 파일도
      #    서버가 git pull 로 받는다. 배포되지 않으면 rate limit 의
      #    `header_up -Forwarded` 같은 방어가 저장소에만 있고 운영에는 없는 상태가 된다.
      #    예전에는 deploy.yml 에 push 트리거를 따로 열어 이 요구를 채웠는데,
      #    그것이 publish 와 경쟁해 2026-09-10 에 옛 이미지를 배포했다(deploy.yml 주석 참고).
      #    문을 하나로 줄이는 대신 여기를 넓힌다.
      #    대가: Caddyfile 한 줄만 고쳐도 이미지 빌드가 한 번 돈다. 캐시가 다 맞아
      #    2~3분이고, 순서가 어긋날 자리를 없애는 값으로는 싸다.
      - 'Caddyfile'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  # 코드 변경 없이 다시 밀고 싶을 때(태그 갱신·실패 재시도)를 위해 수동 실행도 연다.
  workflow_dispatch:

# 🔴 취소하지 않는다. 취소하면 <롤백 지점>이 사라진다 (2026-09-10 실측).
#
# 이 워크플로가 만드는 이미지의 SHA 태그는 "나중에 되돌릴 수 있는 지점" 의 목록이다.
# cancel-in-progress 가 켜져 있으면, main 에 머지가 몰릴 때 앞선 실행이 취소돼
# <그 커밋의 이미지가 영영 만들어지지 않는다.> 실제로 2026-09-09 에 그랬다:
#
#   2026-09-09T07:55  success    ecfc128
#   2026-09-09T07:55  cancelled  bdabaa4   ← 이미지 없음
#   2026-09-09T07:54  cancelled  a0ac224   ← 이미지 없음
#   2026-09-09T07:54  cancelled  7157b9d   ← 이미지 없음
#
# (GHCR 에 manifest inspect 로 물어 확인했다. 셋 다 없다)
#
# 이게 왜 나쁜가: 되돌릴 수 있는 SHA 인지가 <그 커밋의 내용>이 아니라
# <그날 머지가 몰렸는지>에 달리게 된다. 장애가 난 날 "한 칸만 뒤로" 가 안 되고,
# 이미지가 남아 있는 곳까지 여러 칸을 건너뛰어야 하는데, 그 사이에 compose 나
# 마이그레이션 경계가 끼면 롤백이 <더 큰 장애>가 된다(docs/DEPLOY.md §9).
# 아끼는 것은 러너 시간 몇 분이고 잃는 것은 그것이라 교환이 성립하지 않는다.
#
# ⚠️ 대가: 머지가 몰리면 배포도 연달아 돈다. deploy.yml 이 이 워크플로의 성공에
#    딸려 있기 때문이다(workflow_run). 실측하니 최근 머지 40건 중 20건이 직전
#    머지와 120초 안에 붙어 있어, 이 저장소에서는 <몰리는 것이 정상 패턴>이다.
#    다만 그 배포들이 옛 이미지를 올리는 것은 아니다 - 서버는 IMAGE_TAG=latest 로
#    받으므로 그때그때의 latest 를 올린다. 실제 위험은 그 사이의 <어긋남>이다:
#    서버 git 은 pull 로 항상 최신 compose 인데 latest 태그는 아직 앞선 커밋을
#    가리킬 수 있다. 그 한 칸이 8081/8080 같은 어긋남이면 그 배포는 unhealthy 로
#    실패하고, 뒤이은 배포가 따라잡으면서 스스로 낫는다.
#    → 이걸 없애려면 배포가 <자기를 부른 SHA> 에 고정되거나 낡은 실행을 건너뛰어야
#      한다. 그건 deploy.yml 쪽 변경이라 별도 슬라이스로 둔다.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 워크플로 기본은 읽기 전용이다(ci.yml 주석 참고).
    # 쓰기가 필요한 이 잡에만 개별로 준다.
    permissions:
      contents: read
      packages: write
    strategy:
      # 하나가 실패해도 나머지는 끝까지 민다. 둘 다 다시 돌리는 것보다 싸다.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: ai-service
            dockerfile: ai-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # ⚠️ 컨텍스트가 저장소 루트다. api/build.gradle 의 processResources 가
          #    ../widget 을 읽어 위젯 로더를 JAR 에 담기 때문이다.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # 🔴 provenance 를 끈다(v6 기본값은 켜짐).
          #    켜져 있으면 이미지가 OCI index 로 밀리고 그 안에 빌드 실행 정보를 담은
          #    attestation 매니페스트가 함께 들어간다. 그 정보는 매 빌드마다 다르므로
          #    <내용물이 한 바이트도 안 바뀌어도> index digest 가 매번 바뀐다.
          #
          #    2026-09-10 에 그것 때문에 scripts/verify-deploy.sh 가 거짓 실패를 냈다.
          #    그때 그 스크립트는 `docker image inspect .Id`(= index digest)를 기대값으로
          #    썼는데, compose 는 그 안의 <플랫폼 매니페스트 digest> 를 보고 재생성 여부를
          #    판정한다. 즉 compose 가 옳고 검사가 틀렸던 것이다.
          #
          #    ✅ 그 스크립트는 이제 digest 가 아니라 RootFS.Layers(= 이미지 <내용>)를
          #       비교한다. 그래서 <이 줄은 더 이상 그 검사의 전제가 아니다.>
          #       provenance 를 다시 켜도 verify-deploy.sh 는 깨지지 않는다
          #       (자체 점검 scripts/verify-deploy.check.sh ④가 그 상황을 재현해 잰다).
          #       이 줄이 남아 있는 이유는 하나뿐이다 - 껐다 켜면 태그의 media type 이
          #       바뀌어 컨테이너 .Image 가 한 번 이월되는 소동이 또 일어난다(2026-09-10
          #       에 손으로 --force-recreate 해야 했다). 지금 SLSA provenance 를 쓰는
          #       곳이 없어서 켤 이유가 없으므로 그냥 둔다.
          #    대가: SLSA provenance 를 잃는다.
          provenance: false
          # latest 와 커밋 SHA 둘 다 붙인다.
          # 서버는 보통 latest 를 쓰지만, 문제가 생겼을 때 <어느 커밋으로> 되돌릴지
          # 지정할 수 있어야 롤백이 가능하다.
          # ⚠️ 소문자로 <고정>한다. `github.repository` 는 `storyrago/AllDap` 이라
          #    대문자가 섞이는데, Docker 이미지 이름은 소문자만 허용해서
          #    `invalid tag ... repository name must be lowercase` 로 빌드가 죽는다.
          #    (실제로 그래서 GHCR 에 이미지가 한 번도 안 올라갔다)
          tags: |
            ghcr.io/storyrago/alldap/${{ matrix.name }}:latest
            ghcr.io/storyrago/alldap/${{ matrix.name }}:${{ github.sha }}
          # 러너는 매번 새 머신이라 캐시가 없다. GitHub Actions 캐시에 레이어를 남겨
          # 다음 빌드에서 Gradle 의존성 내려받기를 건너뛴다.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
