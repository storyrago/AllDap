name: Publish images

# 왜 별도 워크플로인가
# ─────────────────────────────────────────────────────────────────────────────
# ci.yml 은 "이 변경이 깨졌나" 를 본다(PR 마다). 이 파일은 "배포할 물건을 만든다"
# 이므로 트리거도(main 에 들어간 뒤) 권한도(패키지 쓰기) 다르다. 섞으면 PR 마다
# 이미지를 밀거나, CI 에 쓰기 권한을 상시로 주게 된다.
#
# 🔴 왜 CI 에서 빌드하나 — 서버에서 못 하기 때문이다.
# 배포 대상이 EC2 `t3.micro`(1GB)라 거기서 `docker compose --build` 를 돌리면
# Gradle 컴파일이 OOM 으로 죽는다. 그래서 이미지는 여기서 만들어 GHCR 에 올리고,
# 서버는 `pull` 만 한다. 부수 효과로 서버에 JDK·Gradle 을 둘 필요가 없어졌고,
# 배포가 몇 초로 줄었으며, IMAGE_TAG 를 이전 SHA 로 바꾸면 즉시 롤백된다.
#
# ⚠️ 아키텍처는 linux/amd64 다. t3 는 Intel/AMD x86_64 이고,
#    개발 머신(Apple Silicon)에서 만든 arm64 이미지는 거기서 실행되지 않는다.
#    Graviton(t4g)으로 옮기면 여기를 linux/arm64 로 바꿔야 한다.

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'ai-service/**'
      - 'widget/**'          # 위젯 JS 가 Spring 이미지 안으로 들어간다
      - '.github/workflows/publish.yml'
      # 🔴 아래 셋은 이미지 내용과 무관하다. 그래도 여기 있는 이유는
      #    <배포(deploy.yml)가 이 워크플로의 성공에만 딸려 있기 때문>이다.
      #    Caddyfile 은 bind mount 라 서버 디스크의 파일이 곧 설정이고, compose 파일도
      #    서버가 git pull 로 받는다. 배포되지 않으면 rate limit 의
      #    `header_up -Forwarded` 같은 방어가 저장소에만 있고 운영에는 없는 상태가 된다.
      #    예전에는 deploy.yml 에 push 트리거를 따로 열어 이 요구를 채웠는데,
      #    그것이 publish 와 경쟁해 2026-09-10 에 옛 이미지를 배포했다(deploy.yml 주석 참고).
      #    문을 하나로 줄이는 대신 여기를 넓힌다.
      #    대가: Caddyfile 한 줄만 고쳐도 이미지 빌드가 한 번 돈다. 캐시가 다 맞아
      #    2~3분이고, 순서가 어긋날 자리를 없애는 값으로는 싸다.
      - 'Caddyfile'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  # 코드 변경 없이 다시 밀고 싶을 때(태그 갱신·실패 재시도)를 위해 수동 실행도 연다.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # 워크플로 기본은 읽기 전용이다(ci.yml 주석 참고).
    # 쓰기가 필요한 이 잡에만 개별로 준다.
    permissions:
      contents: read
      packages: write
    strategy:
      # 하나가 실패해도 나머지는 끝까지 민다. 둘 다 다시 돌리는 것보다 싸다.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: ai-service
            dockerfile: ai-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # ⚠️ 컨텍스트가 저장소 루트다. api/build.gradle 의 processResources 가
          #    ../widget 을 읽어 위젯 로더를 JAR 에 담기 때문이다.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # 🔴 provenance 를 끈다. 켜져 있으면(v6 기본값) 이미지가 OCI index 로 밀리고
          #    그 안에 빌드 실행 정보를 담은 attestation 매니페스트가 함께 들어간다.
          #    그 정보는 매 빌드마다 다르므로, <내용물이 한 바이트도 안 바뀌어도>
          #    index digest 가 매번 바뀐다.
          #
          #    그래서 2026-09-10 에 scripts/verify-deploy.sh 가 거짓 실패를 냈다.
          #    그 스크립트는 `docker image inspect .Id`(= index digest)를 기대값으로
          #    쓰는데, compose 는 그 안의 <플랫폼 매니페스트 digest> 를 보고 재생성
          #    여부를 판정한다. 실측: 두 이미지의 Created·크기·RootFS.Layers·Config 가
          #    전부 동일했고, 도는 컨테이너의 com.docker.compose.image 라벨이 레지스트리
          #    index 안 amd64 매니페스트 digest 와 정확히 같았다. 즉 compose 가 옳고
          #    검사가 틀렸던 것이다("ai-service 가 옛 이미지로 돈다" 는 거짓 경보였다).
          #
          #    끄면 내용이 같을 때 digest 도 같아져 그 스크립트가 그대로 옳아진다.
          #    ⚠️ 이 줄을 지우면 verify-deploy.sh 가 다시 거짓 실패를 낸다. 되살리려면
          #       그 스크립트가 플랫폼 매니페스트 digest 를 보도록 함께 고칠 것.
          #    대가: SLSA provenance 를 잃는다. 지금 어디서도 쓰고 있지 않다.
          provenance: false
          # latest 와 커밋 SHA 둘 다 붙인다.
          # 서버는 보통 latest 를 쓰지만, 문제가 생겼을 때 <어느 커밋으로> 되돌릴지
          # 지정할 수 있어야 롤백이 가능하다.
          # ⚠️ 소문자로 <고정>한다. `github.repository` 는 `storyrago/AllDap` 이라
          #    대문자가 섞이는데, Docker 이미지 이름은 소문자만 허용해서
          #    `invalid tag ... repository name must be lowercase` 로 빌드가 죽는다.
          #    (실제로 그래서 GHCR 에 이미지가 한 번도 안 올라갔다)
          tags: |
            ghcr.io/storyrago/alldap/${{ matrix.name }}:latest
            ghcr.io/storyrago/alldap/${{ matrix.name }}:${{ github.sha }}
          # 러너는 매번 새 머신이라 캐시가 없다. GitHub Actions 캐시에 레이어를 남겨
          # 다음 빌드에서 Gradle 의존성 내려받기를 건너뛴다.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
