name: Deploy to EC2

# 왜 이 파일이 있나
# ─────────────────────────────────────────────────────────────────────────────
# 프론트(Vercel)는 main 푸시마다 자동 배포되는데 백엔드(EC2)는 사람이 SSH 로 4단계를
# 돌려야 했다. 그 비대칭이 2026-09-08 과 2026-09-09 에 두 번 운영을 깨뜨렸다:
# 새 프론트가 옛 백엔드에 없는 필드·경로를 부르고, 그 실패는 500 INTERNAL_ERROR
# ("잠시 후 다시 시도해주세요")로 뭉개져 원인이 가려진다. 재시도로는 안 풀린다.
# 문서(docs/DEPLOY.md §9)로 막아보려 했지만 두 번째가 났으므로 자동화한다.
#
# 이 워크플로가 하는 일은 docs/DEPLOY.md §9 의 수동 4단계를 그대로 옮긴 것이다.
# 순서·이유는 그 절의 주석과 같다. 한쪽만 고치면 어긋나므로 함께 볼 것.

on:
  # ① 이미지 빌드(publish.yml)가 <성공한 뒤에만> 돈다.
  #    push 로 같이 걸면 두 워크플로가 병렬로 돌아, EC2 가 아직 GHCR 에 없는
  #    이미지를 pull 한다(옛 latest 를 받고 "배포 성공" 이라고 말한다).
  #
  # 🔴 2026-09-10 에 그 사고가 실제로 났다. 위 세 줄을 적어두고도 아래에 push 트리거를
  #    같이 열어뒀기 때문이다. PR #99 가 docker-compose.prod.yml 을 고치자 두 트리거가
  #    <동시에> 걸렸고, push 쪽 배포가 publish 보다 2분 24초 먼저 pull 해서 옛 api
  #    이미지를 올렸다. 그 이미지는 actuator 가 8080 에 있는데 새 compose 의 헬스체크는
  #    8081 을 찌르므로 영원히 unhealthy 였고, 배포는 SSH 가 끊길 때까지 매달렸다.
  #    (concurrency 는 <겹침>만 막는다. <순서>는 못 막는다. 그게 이번에 드러난 것이다)
  #
  #    그래서 push 트리거를 없앴다. 이미지가 안 바뀌는 변경(Caddyfile·compose)도
  #    배포돼야 하는 것은 맞는데, 그 요구는 <이쪽에 문을 하나 더 여는> 방식이 아니라
  #    publish.yml 의 paths 에 그 경로들을 넣어 ①이 항상 돌게 하는 방식으로 채운다.
  #    문이 하나면 순서가 어긋날 자리가 없다.
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
  # ② 손으로 다시 밀 때(배포 실패 재시도·서버를 새로 만든 직후).
  workflow_dispatch:

# 배포는 겹치면 안 된다. 앞의 배포가 끝나고 다음이 시작하게 큐에 세운다.
# cancel-in-progress 를 켜면 docker compose 가 컨테이너를 갈아끼우는 중간에
# 러너가 죽어 <반만 갱신된 상태>로 남을 수 있다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run 은 publish 가 <실패했을 때도> 돈다. 성공한 경우만 통과시킨다.
    # workflow_dispatch 로 들어온 실행에는 conclusion 이 없으므로 함께 허용한다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      # 서버의 저장소 경로. docs/DEPLOY.md §6 의 `git clone ... && cd AllDap` 기준.
      APP_DIR: /home/ubuntu/AllDap
      COMPOSE: docker compose -f docker-compose.prod.yml --env-file .env.prod

    steps:
      # 러너에서 저장소를 체크아웃하지 않는다. 배포에 필요한 파일은 전부
      # 서버가 자기 디스크에서 git pull 로 받고, 이미지는 GHCR 에서 받는다.
      - name: SSH 키·호스트키 준비
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 🔴 ssh-keyscan 을 여기서 돌리지 않는다. 매 실행마다 "처음 보는 호스트를
          #    그냥 믿는" 것이라 중간자 공격을 하나도 막지 못한다(TOFU 가 아니라 무검증).
          #    사람이 한 번 뽑아 Secrets 에 박아둔 값하고만 대조한다.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


      # docs/DEPLOY.md §9 의 4단계를 그대로 옮긴 것이다. 순서가 전부 이유가 있다.
      #
      # 🔴 이미지 대조(verify-deploy.sh)는 <별도 단계>로 뺐다. 한 단계에 묶여 있으면
      #    "기동이 안 됐다" 와 "기동은 됐는데 옛 이미지로 돈다" 가 같은 실패로 뭉개져,
      #    아래 진단 수집이 어느 쪽을 찍어야 할지 알 수 없다. 실제로 2026-09-10 의
      #    실패는 후자였는데 진단은 전자만 상정하고 짜여 있어 전부 손으로 캐야 했다.
      #    (이 저장소가 반복해 낸 부류다: 원인이 다른 사실을 한 값으로 뭉개는 것)
      - name: 배포 (git pull → image pull → up -d → caddy 강제 재생성)
        id: deploy
        env:
          EC2_TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          # 🔴 ServerAliveInterval 이 없으면 이 단계가 조용히 끊긴다.
          #    아래 `up -d` 는 api 가 healthy 가 될 때까지 매달리는데(ai-service 의
          #    depends_on: service_healthy 때문이다), 그동안 SSH 채널에는 바이트가
          #    하나도 안 흐른다. 2026-09-10 에 288초 침묵 뒤 `client_loop: send
          #    disconnect: Broken pipe` 로 죽었다(종료코드 255).
          #    그 255 는 <원인이 다른 셋>을 같은 값으로 뭉갠다: 옛 이미지를 올렸다 /
          #    진짜로 기동에 실패했다 / 네트워크가 끊겼다. 30초마다 살아 있다고
          #    말하게 해서 마지막 하나를 목록에서 지운다.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$EC2_TARGET" \
            "APP_DIR='$APP_DIR' bash -seuo pipefail" <<'REMOTE'
          cd "$APP_DIR"
          C="docker compose -f docker-compose.prod.yml --env-file .env.prod"

          # 1. git pull 이 먼저다. Caddyfile 은 bind mount(docker-compose.prod.yml 의
          #    `./Caddyfile:/etc/caddy/Caddyfile:ro`)라 이미지가 아니라 서버 디스크의
          #    파일을 읽는다. 서버에 새 Caddyfile 이 없으면 아래 무엇을 해도 옛 설정이다.
          #    --ff-only: 서버에서 손으로 고친 것이 있으면 조용히 머지하지 말고 실패해야 한다.
          git pull --ff-only

          # 2. 이미지 갱신. 빌드는 CI 가 한다, t3.micro(1GB)에서 Gradle 은 OOM 이다.
          $C pull

          # 3. api·ai-service 를 같이 올린다. 내부 경로가 서로 물려 있어 한쪽만 올리면
          #    그 사이 요청이 502 가 난다(재시도하면 풀리는 종류다).
          #
          # 🔴 --wait-timeout 이 왜 필요한가: 이 명령은 그냥 두면 api healthcheck 의
          #    최악 시간만큼 매달린다. compose 설정이 start_period 180s + retries 40 ×
          #    (interval 15s + timeout 5s) 라 최대 약 980초 = 16.3분인데, 이 잡의
          #    timeout-minutes 는 15분이다. 즉 compose 가 "dependency failed to start:
          #    unhealthy" 라는 <진짜 진단>을 내놓기 전에 잡이 반드시 먼저 죽는다.
          #    그러면 로그에 남는 것은 잘린 출력뿐이고 원인을 알 수 없다.
          #    300초로 끊어서 진단이 반드시 로그에 남게 한다. 실측 기동 시간은 27초라
          #    정상 배포가 여기 걸릴 여지는 없다.
          $C up -d --wait --wait-timeout 300

          # 4. 🔴 Caddy 강제 재생성은 <별도 단계>다. bind mount 는 "파일 내용이 바뀌었다"를
          #    Compose 의 재생성 트리거로 보지 않는다. caddy:2-alpine 태그가 그때그때 다른
          #    이미지를 가리켜서, 2번의 pull 이 우연히 새 이미지를 받아오면 재생성되고
          #    아니면 안 된다. 즉 생략하면 Caddyfile 갱신이 "가끔 되고 가끔 안 된다".
          $C up -d --force-recreate caddy

          $C ps
          REMOTE

      # 5. 🔴 "돌았다" 와 "새것으로 바뀌었다" 는 다르다. up -d 가 조용히 아무것도
      #    안 해도 앞 단계는 전부 초록불이고, 아래 헬스체크의 공개 URL 은 버전을
      #    모르므로 옛 컨테이너에도 200 을 준다. 2026-09-09 의 사고가 그 모양이었다.
      #    그래서 <받은 이미지>와 <도는 이미지>를 대조한다. 근거는 스크립트 주석 참고.
      - name: 이미지 대조 (받은 것 = 도는 것인가)
        id: verify
        env:
          EC2_TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$EC2_TARGET" \
            "APP_DIR='$APP_DIR' bash -seuo pipefail" <<'REMOTE'
          cd "$APP_DIR"
          bash scripts/verify-deploy.sh
          REMOTE

      # 배포 명령이 성공했다고 밖에서 서비스가 보이는 것은 아니다.
      # 여기서 보는 것은 <사슬>이다: DNS -> TLS -> Caddy -> Spring.
      #
      # 🔴 /actuator/health 를 부르지 않는다. PR #99 로 actuator 가 management 포트
      #    8081 로 옮겨갔고 Caddy 는 `reverse_proxy api:8080` 하나만 안다. 그래서
      #    이 URL 은 이제 <존재하지 않는 경로>다(2026-09-10 실측: HTTP 500).
      #    ⚠️ Caddy 로 그 경로만 8081 에 열어주는 해법은 쓰지 않는다.
      #       /actuator/prometheus 가 permitAll 이라, 나중에 누가 matcher 를
      #       /actuator/* 로 넓히는 순간 스크레이프가 인터넷에 열린다.
      #       그건 코드가 아니라 리뷰로만 막히는 종류다.
      #
      # 그럼 "Spring 이 UP 인가" 는 누가 보나: 앞 단계의 `up -d --wait` 다.
      # compose 가 컨테이너 헬스체크(8081)의 healthy 를 기다렸다가 안 되면 실패한다.
      # <이미 도는 검사>를 재활용하는 것이라, 이 저장소가 두 번 겪은
      # "짜뒀는데 아무 데서도 안 도는 검사" 가 원리적으로 생기지 않는다.
      #
      # 🔴 두 URL 을 <나눠서> 친다. 하나로 합치면 서로 다른 고장이 뭉개진다.
      #    - 정적 파일: DB 를 안 거친다. 이것만 200 이면 Spring 은 떴다는 뜻.
      #    - 위젯 설정: bots 테이블을 읽는다. 여기서 갈리면 DB 쪽 문제다.
      #    LLM 을 부르는 경로(/api/w/{key}/chat)는 돈이 드니 쓰지 않는다.
      #
      # ⚠️ 설정 조회는 V1 시드 봇 `pk_local_dev` 에 딸려 있다. 그 봇을 지우면 여기가
      #    깨진다(AGENTS.md Flyway 규칙 4번이 지우지 말라고 못박아둔 이유가 하나 늘었다).
      - name: 헬스체크 (밖에서 HTTPS 로 사슬을 확인)
        id: health
        env:
          API_DOMAIN: alldap.duckdns.org
        run: |
          # caddy 를 방금 강제 재생성했으니 몇 초는 기다려준다. 15초 간격 12회 = 최대 3분.
          # Spring 기동은 앞 단계에서 이미 끝났으므로 예전처럼 6분을 줄 이유가 없다.
          static_ok=""
          config_ok=""
          for i in $(seq 1 12); do
            if [ -z "$static_ok" ] \
               && curl -fsS -m 10 -o /dev/null "https://$API_DOMAIN/widget/alldap-widget.js"; then
              static_ok=1
              echo "OK 정적 리소스 (${i}번째). DNS·TLS·Caddy·Spring 사슬이 이어진다"
            fi
            if [ -n "$static_ok" ]; then
              body=$(curl -fsS -m 10 "https://$API_DOMAIN/api/w/pk_local_dev/config" || true)
              case "$body" in
                *'"botName"'*)
                  config_ok=1
                  echo "OK 위젯 설정 조회 (${i}번째). DB 왕복까지 정상: $body"
                  break ;;
              esac
              echo "${i}/12 설정 조회 대기 중... ($body)"
            else
              echo "${i}/12 정적 리소스 대기 중..."
            fi
            sleep 15
          done

          if [ -z "$static_ok" ]; then
            echo "::error::밖에서 https://$API_DOMAIN/widget/alldap-widget.js 가 3분 동안 200 이 아니었다."
            echo "  Spring 은 앞 단계의 --wait 를 통과했으므로 바깥쪽이 의심된다:"
            echo "  Caddy 컨테이너 · Caddyfile · TLS 인증서 · DuckDNS A 레코드"
            exit 1
          fi
          if [ -z "$config_ok" ]; then
            echo "::error::정적 리소스는 200 인데 위젯 설정 조회가 3분 동안 실패했다."
            echo "  = Spring 은 떴는데 그 뒤가 문제다. 후보: RDS 연결이 안 됨,"
            echo "  또는 시드 봇 pk_local_dev 가 삭제됨(그 경우 404 다)."
            exit 1
          fi


      # 빨간불에 단서가 없으면 다음 사람이 서버에 들어가 다시 재현해야 한다.
      # 실패한 그 순간의 상태를 로그에 남긴다. 이 단계 자체는 실패시키지 않는다
      # (`|| true`) - 진단을 못 모은 것이 배포 실패를 덮어써서는 안 된다.
      #
      # 🔴 <어느 단계에서 깨졌느냐에 따라 다른 것을 남긴다.> 2026-09-10 의 실패에서
      #    평가해보니 절반만 쓸모 있었다: `ps` 는 결정적이었는데(IMAGE 칸이 태그가
      #    아니라 sha256:779b4761... 로 찍혀 "옛 이미지로 돈다" 가 눈으로 보였다)
      #    나머지는 그 실패와 무관했고 — api 는 19.58초에 healthy 로 정상 기동했고
      #    ai-service 로그는 4줄뿐이었다 — 정작 필요한 이미지 digest 넷은 하나도 없어
      #    전부 손으로 캐야 했다. 진단이 "기동이 안 됐을 때" 만 상정하고 짜여 있었다.
      - name: 실패 시 진단 수집
        if: failure()
        env:
          EC2_TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          # 앞 단계가 실패하면 뒤 단계는 skipped 라, 위에서부터 처음 만나는 failure 가
          # 곧 깨진 자리다. 어느 것도 아니면(SSH 키 준비 단계 등) unknown 으로 두고
          # 공통 부분만 찍는다 - 모르면서 아는 척 찍으면 다음 사람을 헤매게 한다.
          STAGE: >-
            ${{ steps.deploy.outcome == 'failure' && 'startup'
             || steps.verify.outcome == 'failure' && 'verify'
             || steps.health.outcome == 'failure' && 'health'
             || 'unknown' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$EC2_TARGET" \
            "APP_DIR='$APP_DIR' STAGE="$STAGE" bash -seuo pipefail" <<'REMOTE' || true
          cd "$APP_DIR"
          C="docker compose -f docker-compose.prod.yml --env-file .env.prod"

          # 🔴 ps 는 어느 단계든 <맨 위>다. 세 실패 모두에서 쓸모가 있었던 유일한 값인데,
          #    그 아래로 정상 부팅 로그 200줄이 흐르면 화면에서 묻힌다. 아래 로그에
          #    전부 --tail 을 건 이유도 같다: 결정적인 한 줄이 안 묻히는 게 목적이다.
          echo "===== ps  (실패 단계: ${STAGE}) ====="
          $C ps

          case "$STAGE" in
            verify)
              # 이미지 대조가 틀어졌을 때 필요한 값들. 넷이 <서로 다른 것을 기록한다>:
              #   - image inspect .Id : 태그가 지금 가리키는 것. provenance 가 켜져 있으면
              #                         OCI index digest 이고, 꺼져 있으면 플랫폼 매니페스트다.
              #   - 컨테이너 .Image   : containerd 가 <pull 당시> 저장한 값. 컨테이너를
              #                         재생성하기 전까지 형식이 옛것으로 남는다.
              #   - compose 라벨      : compose 가 재생성 여부를 판정할 때 보는 값
              #                         (플랫폼 매니페스트). 라벨 = 태그면 compose 는
              #                         "안 바뀌었다" 고 보고 아무것도 안 한다.
              #   - 레지스트리 mediaType : index 인지 단일 매니페스트인지. 이게 index 면
              #                         publish.yml 의 provenance: false 가 안 먹은 것이다.
              # 2026-09-10 에 <라벨은 맞는데 .Image 만 옛 형식> 인 상태가 실제로 났고,
              # compose 는 그걸 스스로 수렴시키지 않는다. 넷을 나란히 봐야 갈린다.
              # (근거: docs/HANDOFF-2026-09-10-2.md §2)
              for svc in api ai-service; do
                cid=$($C ps -q "$svc" 2>/dev/null | head -1 || true)
                tag=$($C config --format json 2>/dev/null | jq -r --arg s "$svc" '.services[$s].image' || echo '(알 수 없음)')
                echo "===== ${svc}  (${tag}) ====="
                echo "  받은 것  image inspect .Id : $(docker image inspect -f '{{.Id}}' "$tag" 2>/dev/null || echo '(태그가 로컬에 없다 = pull 이 안 됐다)')"
                if [ -z "$cid" ]; then
                  echo "  컨테이너가 없다. up -d 가 이 서비스를 못 띄웠다."
                  continue
                fi
                echo "  도는 것  container .Image : $(docker inspect -f '{{.Image}}' "$cid")"
                echo "  compose 라벨              : $(docker inspect -f '{{index .Config.Labels "com.docker.compose.image"}}' "$cid" 2>/dev/null || echo '(라벨 없음)')"
                echo "  컨테이너 생성 시각        : $(docker inspect -f '{{.Created}}' "$cid")"
                echo "  레지스트리 mediaType      :"
                # buildx 가 없거나 GHCR 인증이 없으면 못 본다. 그때도 위 셋은 남는다.
                docker buildx imagetools inspect --raw "$tag" 2>/dev/null \
                  | grep -o '"mediaType": *"[^"]*"' | head -3 \
                  || echo "    (조회 실패: buildx 없음 또는 레지스트리 인증 없음)"
              done
              ;;
            health)
              # 앞 단계들이 통과했다 = 컨테이너는 새 이미지로 healthy 하게 돈다.
              # 그러면 의심 구간은 <그 바깥>이다: Caddy · TLS · DNS.
              # 그래서 api 로그가 아니라 caddy 로그가 먼저다.
              echo "===== caddy 로그 (마지막 80줄) ====="
              $C logs --tail=80 caddy || true
              # 🔴 안에서 200 인데 밖에서 아니면 Spring 이 아니라 Caddy·TLS·DNS 문제다.
              #    이 한 줄이 그 둘을 가른다(밖에서는 원리적으로 못 가른다).
              cid=$($C ps -q api 2>/dev/null | head -1 || true)
              if [ -n "$cid" ]; then
                docker exec "$cid" curl -fsS -m 5 -o /dev/null \
                  -w '  api 컨테이너 안 8080 /widget/alldap-widget.js: %{http_code}\n' \
                  http://localhost:8080/widget/alldap-widget.js || echo "  api 컨테이너 안에서도 실패했다 = Spring 쪽이다"
              fi
              echo "===== api 로그 (마지막 60줄) ====="
              $C logs --tail=60 api || true
              ;;
            *)
              # 기동 실패(또는 어느 단계인지 모를 때). 여기서는 로그가 본론이다.
              echo "===== api 로그 (마지막 120줄) ====="
              $C logs --tail=120 api || true
              echo "===== ai-service 로그 (마지막 60줄) ====="
              $C logs --tail=60 ai-service || true
              echo "===== api 컨테이너 헬스체크 상세 ====="
              cid=$($C ps -q api 2>/dev/null | head -1 || true)
              [ -n "$cid" ] && docker inspect -f '{{json .State.Health}}' "$cid" || true
              ;;
          esac
          REMOTE
